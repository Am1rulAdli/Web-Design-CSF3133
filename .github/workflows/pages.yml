name: Deploy Hijayu Cafe to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "customer.html"
      - "payment.html"
      - "webdesign.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare customer website
        run: |
          mkdir site
          cp customer.html site/index.html
          cp payment.html site/payment.html
          cp webdesign.html site/webdesign.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
